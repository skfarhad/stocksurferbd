name: Publish

# Trusted Publishing (OIDC) to TestPyPI / PyPI. No API tokens needed:
# the `id-token: write` permission lets PyPI verify this workflow.
#
# - Manual run (Actions tab -> Publish -> Run workflow): choose testpypi or pypi.
# - On a published GitHub Release: publishes to PyPI.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        working-directory: stocksurferbd_pkg
        run: |
          python -m pip install --upgrade setuptools wheel
          python setup.py sdist bdist_wheel
      - name: Validate metadata
        working-directory: stocksurferbd_pkg
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: stocksurferbd_pkg/dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
